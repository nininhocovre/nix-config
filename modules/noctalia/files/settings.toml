[bar.default]
center = [ "taskbar" ]
end = [
    "tray",
    "group:g1",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "control-center",
    "session",
    "date",
    "clock"
]
margin_edge = 6
margin_ends = 6
position = "bottom"
scale = 1.2000000104308128
start = [ "launcher", "wallpaper", "media", "active_window" ]
thickness = 42

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
position = "bottom_center"

[osd]
position = "bottom_center"
position_vertical = "bottom_center"

[shell]
font_family = "Hasklug Nerd Font Mono"

    [shell.panel]
    session_placement = "centered"

[theme]
builtin = "Catppuccin"
community_palette = "One"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/nininho/Pictures"
transition_on_startup = true

[widget.active_window]
capsule = true

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.session]
scale = 1.2

[widget.sysmon]
stat = "swap_pct"

[widget.taskbar]
group_by_workspace = true
workspace_label_placement = "inside"

[widget.tray]
capsule = true

[widget.volume]
capsule = true
