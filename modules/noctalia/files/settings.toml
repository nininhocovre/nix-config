[bar.default]
center = [ "taskbar" ]
end = [
    "tray",
    "group:g1",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "control-center",
    "session",
    "date",
    "clock"
]
margin_edge = 6
margin_ends = 6
position = "bottom"
scale = 1.2000000104308128
start = [ "launcher", "wallpaper", "media", "active_window" ]
thickness = 42

    [[bar.default.capsule_group]]
    fill = "surface_container"
    id = "g1"
    members = [ "cpu", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "bottom_center"

[osd]
position = "bottom_center"
position_vertical = "bottom_center"

[shell]
font_family = "Hasklug Nerd Font Mono"

    [shell.panel]
    session_placement = "centered"

[theme]
builtin = "Catppuccin"
community_palette = "One"
mode = "light"
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/nininho/nix-config/modules/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nininho/nix-config/modules/wallpapers/train-sideview.webp"

    [wallpaper.last]
    path = "/home/nininho/nix-config/modules/wallpapers/train-sideview.webp"

    [wallpaper.monitors.DP-2]
    path = "/home/nininho/nix-config/modules/wallpapers/train-sideview.webp"

[widget.active_window]
capsule = true

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.session]
scale = 1.2

[widget.sysmon]
stat = "swap_pct"

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
workspace_label_placement = "inside"

[widget.tray]
capsule = true

[widget.volume]
capsule = true
